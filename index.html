<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimePass Zone 🎮</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
}

header {
    padding: 25px 10px;
}

header h1 {
    font-size: 38px;
}

header p {
    margin-top: 8px;
    color: #ddd;
}

.card {
    width: 90%;
    max-width: 500px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
}

button {
    border: none;
    padding: 13px 25px;
    margin: 8px;
    border-radius: 30px;
    background: #00cec9;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#target {
    width: 65px;
    height: 65px;
    background: #ff4757;
    border-radius: 50%;
    position: absolute;
    display: none;
    cursor: pointer;
    box-shadow: 0 0 25px #ff4757;
}

#gameArea {
    position: relative;
    height: 450px;
    margin-top: 20px;
    border: 2px solid white;
    border-radius: 20px;
    overflow: hidden;
}

.score {
    font-size: 22px;
    margin: 15px;
}

footer {
    padding: 25px;
    color: #bbb;
}
</style>
</head>

<body>

<header>
    <h1>🎮 TimePass Zone</h1>
    <p>Game khelo aur high score todo! 🔥</p>
</header>

<div class="card">

    <h2>🎯 Tap The Circle</h2>

    <div class="score">
        Score: <span id="score">0</span>
        &nbsp; | &nbsp;
        Time: <span id="time">30</span>
    </div>

    <button onclick="startGame()">🚀 Start Game</button>

    <div id="gameArea">
        <div id="target" onclick="hitTarget()"></div>
    </div>

    <h3 id="message">Start dabao 😎</h3>

</div>

<footer>
    Made for Timepass 😂 | 🎮 TimePass Zone
</footer>

<script>

let score = 0;
let time = 30;
let timer;
let playing = false;

const target = document.getElementById("target");
const gameArea = document.getElementById("gameArea");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const message = document.getElementById("message");

function startGame() {

    score = 0;
    time = 30;
    playing = true;

    scoreText.innerText = score;
    timeText.innerText = time;

    message.innerText = "🔥 GO GO GO!";

    target.style.display = "block";

    moveTarget();

    clearInterval(timer);

    timer = setInterval(function() {

        time--;

        timeText.innerText = time;

        if (time <= 0) {
            endGame();
        }

    }, 1000);
}

function hitTarget() {

    if (!playing) return;

    score++;

    scoreText.innerText = score;

    moveTarget();
}

function moveTarget() {

    let maxX = gameArea.clientWidth - target.offsetWidth;
    let maxY = gameArea.clientHeight - target.offsetHeight;

    let x = Math.random() * maxX;
    let y = Math.random() * maxY;

    target.style.left = x + "px";
    target.style.top = y + "px";
}

function endGame() {

    playing = false;

    clearInterval(timer);

    target.style.display = "none";

    message.innerText =
        "⏰ Game Over! Score: " + score + " 🔥";
}

</script>

</body>
</html>
